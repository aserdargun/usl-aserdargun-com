name: Deploy Azure Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-usl-aserdargun-com-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test and build the static export
        run: npm test
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      - name: Verify the deployment artifact
        shell: bash
        run: |
          test -f out/index.html
          test -f out/tr/index.html
          test -f out/en/index.html
          test -f out/staticwebapp.config.json
          grep -Rq "${GITHUB_SHA::7}" out
      - name: Upload to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch head 2024-09-11
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_USL_ASERDARGUN_COM }}
          action: upload
          app_location: out
          skip_app_build: true
          output_location: ""
