name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:rendered
      - run: npm run build:azure
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      - run: npm run test:static-rendered
      - run: node --test tests/deployment-workflow.test.mjs
